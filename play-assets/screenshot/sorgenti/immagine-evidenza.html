<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<!-- Immagine in evidenza Play Store 1024×500. Cambia i testi qui sotto e apri il file in Chrome. -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,600;0,700;1,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body { position: relative; font-family: 'Titillium Web', sans-serif; color: #fff;
    background: radial-gradient(70% 120% at 72% 45%, #ff4558 0%, #e3001b 42%, #a30013 80%, #7a000e 100%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#ffffff14 2px, transparent 2px), linear-gradient(90deg, #ffffff14 2px, transparent 2px); background-size: 48px 48px; }
  .flag { position: absolute; left: 0; right: 0; bottom: 0; height: 100px; opacity: .16;
    background: conic-gradient(#000 25%, transparent 0 50%, #000 0 75%, transparent 0) 0 0 / 26px 26px;
    -webkit-mask-image: linear-gradient(0deg, #000, transparent); mask-image: linear-gradient(0deg, #000, transparent); }
  .logo { position: absolute; left: 58px; top: 70px; width: 150px; border-radius: 34px; box-shadow: 0 14px 30px #0006, 0 0 0 4px #fff; }
  h1 { position: absolute; left: 236px; top: 72px; font-size: 118px; line-height: 1; font-weight: 900; font-style: italic; letter-spacing: -1px; text-shadow: 0 6px 24px #0005; }
  h1 span { color: #ffe27a; }
  .tag { position: absolute; left: 60px; top: 268px; font-size: 40px; line-height: 1.05; font-weight: 900; font-style: italic; text-transform: uppercase; text-shadow: 0 4px 16px #0005; }
  .tag em { color: #ffe27a; font-style: italic; }
  .small { position: absolute; left: 62px; top: 372px; font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #ffe1e6; text-transform: uppercase; }
  .z { position: absolute; border-radius: 22px; box-shadow: 0 18px 30px #0007, 0 0 0 4px #fff; }
</style></head>
<body>
  <div class="grid"></div><div class="flag"></div>
  <img class="logo" src="img/logo.png">
  <h1>Grid<span>Up</span></h1>
  <p class="tag">Il Mondiale in <em>punti,</em><br>scenari e classifiche</p>
  <p class="small">Classifiche · Scenari · Confronti</p>
  <img class="z" src="img/zoom-ferrari.png" style="left:640px;top:58px;width:330px;transform:rotate(6deg)">
  <img class="z" src="img/zoom-sfida.png" style="left:612px;top:262px;width:360px;transform:rotate(-5deg)">
</body></html>
