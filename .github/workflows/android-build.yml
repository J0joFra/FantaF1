name: Build Android APK

# Compila un APK di debug in cloud (nessun Android Studio locale richiesto).
# Avvialo a mano da GitHub → tab "Actions" → "Build Android APK" → "Run workflow",
# poi scarica l'APK dagli "Artifacts" del run.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        # Vite incorpora le variabili VITE_ nel bundle al momento della build:
        # se non ci sono qui, nell'APK sono `undefined` e non c'è modo di
        # rimediarle a runtime. È il motivo per cui la segnalazione bug non
        # partiva nell'app pubblicata mentre in locale, con il .env, funzionava.
        # I secret vanno impostati in Settings → Secrets and variables →
        # Actions; se mancano, la build passa lo stesso e la funzione resta
        # spenta invece di far fallire il rilascio.
        env:
          VITE_BUG_REPORT_WEBHOOK_URL: ${{ secrets.VITE_BUG_REPORT_WEBHOOK_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.run_number }}
        run: npm run build

      - name: Controlla cosa è finito nel bundle
        # Un avviso visibile invece di scoprirlo da un utente che segnala che
        # le segnalazioni non arrivano.
        run: |
          if grep -rqs "script.google.com/macros" dist/assets; then
            echo "✅ Webhook segnalazioni presente nel bundle"
          else
            echo "::warning::VITE_BUG_REPORT_WEBHOOK_URL non è nel bundle: nell'APK il pulsante \"Segnala un problema\" darà errore. Imposta il secret e ricompila."
          fi

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gridup-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
