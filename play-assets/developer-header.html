<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:576px;overflow:hidden}
body{position:relative;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
 background:radial-gradient(60% 80% at 50% 40%,rgba(232,0,45,.38),transparent 70%),
            radial-gradient(120% 120% at 50% 120%,rgba(232,0,45,.25),transparent 60%),#0e0f13;
 display:flex;flex-direction:column;align-items:center;justify-content:center}
body::before{content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 3px,transparent 3px 22px)}
.flag{position:absolute;left:0;right:0;bottom:0;height:22px;opacity:.14;
 background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/22px 22px}
.name{position:relative;font-size:76px;font-weight:900;letter-spacing:-1.5px;line-height:1;text-shadow:0 8px 30px rgba(0,0,0,.5)}
.sub{position:relative;margin-top:14px;font-size:22px;font-weight:700;letter-spacing:6px;color:rgba(255,255,255,.75)}
.sub b{color:#ff3355}
.apps{position:relative;margin-top:44px;display:flex;gap:56px}
.app{display:flex;flex-direction:column;align-items:center;gap:12px}
.app img{width:132px;height:132px;border-radius:30px;box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.12)}
.app span{font-size:22px;font-weight:800;letter-spacing:.5px}
</style></head><body>
<div class="name">Joaquim Francalanci</div>
<div class="sub">FORMULA 1 <b>•</b> APPS <b>•</b> GAMES</div>
<div class="apps">
 <div class="app"><img src="../store_icon.png"><span>GridUp</span></div>
 <div class="app"><img src="driver-clash-icon-512.png"><span>Driver Clash</span></div>
</div>
<div class="flag"></div>
</body></html>
