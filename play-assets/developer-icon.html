<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px;overflow:hidden}
body{position:relative;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:linear-gradient(135deg,#E8002D 0%,#B80024 52%,#1a1b22 52.2%,#0e0f13 100%);}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 28px);
 -webkit-mask-image:linear-gradient(135deg,#000 0 52%,transparent 52.2%)}
.flag{position:absolute;right:-40px;bottom:46px;width:300px;height:44px;transform:rotate(-45deg);opacity:.22;
 background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/22px 22px}
.jf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 color:#fff;font-size:250px;font-weight:900;font-style:italic;letter-spacing:-14px;padding-right:18px;
 text-shadow:0 10px 30px rgba(0,0,0,.45)}
</style></head><body><div class="stripes"></div><div class="flag"></div><div class="jf">JF</div></body></html>
